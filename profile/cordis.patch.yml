# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: commandcode
    model: deepseek/deepseek-v4.1-flash
    reasoningEffort: max
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    purpose: both
    process: detailed
    completion: completed
    usage: detailed
    developerTools: true
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: verbose
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-theme
  name: "@deepseek-ai/dsh-client-ui-theme"
  config:
    preference: light
- id: ui-conversation
  name: "@deepseek-ai/dsh-client-ui-conversation"
  config:
    busyEnter: steer
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      cline:
        apiKeyEnv: CLINE_API_KEY
        api: openai-completions
        baseURL: https://api.cline.bot/api/v1
        models:
          - id: cline-pass/deepseek-v4.1-flash
            name: cline-pass/deepseek-v4.1-flash
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              off: null
              low: low
              high: high
              max: max
        displayName: Cline Pass
      commandcode:
        displayName: Command Code
        apiKeyEnv: COMMANDCODE_API_KEY
        api: openai-responses
        baseURL: https://api.commandcode.ai/provider/v1
        models:
          - id: deepseek/deepseek-v4.1-flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              high: high
              max: max
          - id: deepseek/deepseek-v4.1-flash-fast
            name: DeepSeek V4.1 Flash Fast (latest)
            contextWindow: 1000000
            input:
              - text
              - image
            reasoningEfforts:
              high: high
              max: max
      github-copilot:
        models:
          - id: gpt-5.6-luna
          - id: gpt-6-luna
          - id: mai-code-1.1-flash
          - id: claude-haiku-4.5
      jiangfan:
        apiKeyEnv: JIANGFAN_API_KEY
        api: openai-responses
        baseURL: https://sub.mathhomework.top/v1
        models:
          - id: gpt-6-astra
            name: GPT-6 Astra
            input:
              - text
              - image
            reasoningEfforts:
              medium: medium
              high: high
            contextWindow: 1000000
          - id: gpt-6-astra-fast
            name: gpt-6-astra-fast
            input:
              - text
              - image
            reasoningEfforts:
              medium: medium
              high: high
            contextWindow: 1000000
          - id: gpt-6.1-sol
            name: GPT-6.1 Sol
            input:
              - text
              - image
            reasoningEfforts:
              medium: medium
              high: high
            contextWindow: 1000000
          - id: gpt-6.1-sol-fast
            name: gpt-6.1-sol-fast
            input:
              - text
              - image
            reasoningEfforts:
              medium: medium
              high: high
            contextWindow: 1000000
          - id: gpt-image-2.5-sunburst
            name: GPT Image 2.5 Sunburst
            input:
              - text
              - image
            reasoningEfforts:
              medium: medium
              high: high
- id: agent-preset-registry
  name: "@deepseek-ai/dsh-agent-preset-registry"
  config:
    default: standard
    selectedDefault: ptc-custom
- id: codex-subscription
  name: dsh-codex-subscription
  config:
    quickQuotaMode: forecast
    connectors: read
    imageSketch: true
- id: better-sidebar
  name: dsh-better-sidebar
  config:
    agentOpenTools: true
- id: dsh-catppuccin
  name: "@nonamelego/dsh-catppuccin"
  config:
    glass:
      enabled: true
      mode: compat
      blur: 12
      frost: 45
      brightness: 50
      glow: false
    flavor: catppuccin-latte
    autoCheck: true
    updateChannel: latest
    overrides: {}
    shikiStyle: italic-comments
- id: mnemon
  name: dsh-mnemon
  config:
    remoteAccess: read-only
    timeoutMs: 10000
    defaultRecallLimit: 10
    embedding:
      enabled: false
      endpoint: http://localhost:11434
      model: nomic-embed-text
    memoryView:
      strategyTypeId: default-three-tier
      entries:
        include:mnemon-strategy-auto-capture:
          config: {}
        include:mnemon-strategy-scoped:
          config: {}
        include:mnemon-strategy-light-context:
          config: {}
    recallQuality:
      policy: strict-v1
      lowScoreThreshold: 0.25
      highScoreThreshold: 0.6
      candidateMultiplier: 3
      maxMediumResults: 4
      maxUnknownResults: 2
    routingGuidance: true
    tabEnabled: true
    writeEnabled: true
    lifecycleEnabled: true
    recallMode: guided
    writebackMode: guided
    idleReviewMs: 30000
- id: mnemon-strategy-auto-capture
  disabled: false
- id: mnemon-strategy-scoped
  disabled: false
- id: mnemon-strategy-light-context
  disabled: false
- id: web
  name: "@deepseek-ai/dsh-web"
  config:
    searchProvider: ddg
    fetchProvider: fs-quality-fetch
- id: ui-neartoken-provider
  name: dsh-neartoken
  config:
    enabledModels:
      - deepseek-flash

# 去重：@morlay/ui-conversation-manager 与 -message-actions 是 client-only 包
# （只有 dsh.client、没有 dsh.bundle），dshmarket 每次启动都会在
# .dsh-market/hot-*.yml 里为它们补一条 shim；better-session bundle 同时插入了
# 同名 host 行，client-modules 会因“同一个包名解析到两个 loader 源”而跳过渲染。
# 保留 market 的 shim，禁用 better-session 的重复行。
- id: ui-git-graph
  disabled: false
- id: univer
  disabled: false
- id: subagent-model-selection-settings
  name: "@deepseek-ai/dsh-tool-subagent/model-selection-settings"
  config:
    enabled: false
    allowedModels:
      - provider: commandcode
        model: deepseek/deepseek-v4.1-flash
      - provider: jiangfan
        model: gpt-6.1-sol
